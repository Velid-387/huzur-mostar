<section id="faq" class="animate-section">
    <div class="container">
        <h2 class="animate-item">Najčešće postavljena pitanja</h2>
        <div class="faq-container">
            <div class="faq-item animate-item animated"
                 *ngFor="let item of faqItems; let i = index"
                 [class.active]="item.isOpen">
                <h3 class="faq-heading">
                    <button type="button" class="faq-question" [attr.aria-expanded]="item.isOpen" [attr.aria-controls]="'faq-answer-' + i" (click)="toggleFaq(i)">
                        <span>{{ item.question }}</span>
                        <span class="faq-icon" aria-hidden="true">{{ item.isOpen ? '−' : '+' }}</span>
                    </button>
                </h3>
                <div class="faq-answer" [id]="'faq-answer-' + i" [innerHTML]="item.answer"></div>
            </div>
        </div>
    </div>
</section>
