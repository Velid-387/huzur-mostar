<section id="faq" class="animate-section">
    <div class="container">
        <div class="section-head animate-item">
            <h2>Najčešće postavljena pitanja</h2>
            <p class="section-lead">Ono što nas huzur ljudi najčešće pitaju prije narudžbe. Ako vaše pitanje nije ovdje, javite se.</p>
        </div>

        <div class="faq-layout">
            <aside class="faq-aside animate-item" style="--d: 0.1s">
                <app-botanical variant="petals" class="faq-botanical"></app-botanical>
                <p class="faq-aside-title">Niste našli odgovor?</p>
                <p class="faq-aside-text">Najbrže je pozvati ili poslati poruku na Instagramu. Odgovaramo u sklopu radnog vremena.</p>
                <div class="faq-aside-actions">
                    <a class="btn" href="tel:+387603352011"><i class="fas fa-phone" aria-hidden="true"></i> Pozovite nas</a>
                    <a class="faq-aside-link" href="https://ig.me/m/huzur.mostar" target="_blank" rel="noopener">Pošaljite DM</a>
                </div>
            </aside>

            <div class="faq-container animate-item" style="--d: 0.15s">
                <div class="faq-item"
                     *ngFor="let item of faqItems; let i = index"
                     [class.active]="item.isOpen">
                    <h3 class="faq-heading">
                        <button type="button" class="faq-question" [attr.aria-expanded]="item.isOpen" [attr.aria-controls]="'faq-answer-' + i" (click)="toggleFaq(i)">
                            <span class="faq-question-text">{{ item.question }}</span>
                            <span class="faq-icon" aria-hidden="true"></span>
                        </button>
                    </h3>
                    <div class="faq-answer" [id]="'faq-answer-' + i" role="region" [attr.aria-hidden]="!item.isOpen">
                        <div class="faq-answer-inner" [innerHTML]="item.answer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
