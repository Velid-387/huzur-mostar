<section id="form-success">
  <div class="hero-bloom hero-bloom-pink" aria-hidden="true"></div>
  <div class="hero-bloom hero-bloom-green" aria-hidden="true"></div>

  <div class="container">
    <div class="success-card">
      <div class="success-content">
        <div class="success-icon rise" style="--d: 0s" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path class="checkmark" d="M4 12.5l5 5L20 6.5" />
          </svg>
        </div>

        <h1 class="rise" style="--d: 0.15s">Poruka Uspješno Poslana!</h1>
        <div class="ink-rule" aria-hidden="true"></div>

        <p class="success-message rise" style="--d: 0.35s">
          Hvala vam na vašoj poruci. Naš tim će vam odgovoriti što je prije moguće.
        </p>

        <p class="sub-message rise" style="--d: 0.5s">
          Dok čekate, možete istražiti naše proizvode ili pročitati naš blog.
        </p>

        <div class="action-buttons rise" style="--d: 0.65s">
          <a routerLink="/" class="btn primary-btn">Povratak na Početnu</a>
          <a routerLink="/blog" class="btn secondary-btn">Naš blog</a>
        </div>
      </div>
    </div>
  </div>
</section>
