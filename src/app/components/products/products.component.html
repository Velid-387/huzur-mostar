<section id="products" class="animate-section">
    <div class="container">
        <div class="section-head animate-item">
            <h2>Naša ponuda</h2>
            <p class="section-lead">Uživajte u odabranoj huzur ponudi ručno rađenih cvjetnih aranžmana prilagođenih
                raznoraznim životnim prilikama.</p>
        </div>

        <div class="product-section animate-item" *ngFor="let cat of categories" [id]="cat.key">
            <div class="product-section-head">
                <h3>{{ cat.title }}</h3>
                <p>{{ cat.text }}</p>
            </div>

            <div class="carousel-container">
                <div class="carousel-wrapper" [ngClass]="getCarouselWrapperClass(cat.key)"
                    [style.transform]="'translateX(' + carouselStates[cat.key].translateX + 'px)'">
                    <div class="product-card"
                        *ngFor="let product of carouselStates[cat.key].products; let i = index"
                        [class.active]="isActive(cat.key, i)"
                        [class.left]="isLeftProduct(cat.key, i)"
                        [class.right]="isRightProduct(cat.key, i)"
                        [attr.aria-hidden]="isActive(cat.key, i) ? null : true">
                        <article class="product-card-inner">
                            <div class="product-media">
                                <app-optimized-image
                                    [src]="product.imgSrc"
                                    [alt]="product.imgAlt"
                                    [width]="768"
                                    class="product-img">
                                </app-optimized-image>
                                <div class="auto-scroll-indicator" *ngIf="showTimer(cat.key, i) && !autoplayStopped" aria-hidden="true">
                                    <svg class="timer-svg" viewBox="0 0 32 32">
                                        <circle class="timer-background" cx="16" cy="16" r="14"></circle>
                                        <circle class="timer-progress" cx="16" cy="16" r="14"
                                            [style.strokeDashoffset]="carouselStates[cat.key].timerProgress">
                                        </circle>
                                    </svg>
                                </div>
                            </div>
                            <div class="product-info">
                                <h4 class="product-name">{{ product.title }}</h4>
                                <p>{{ product.description }}</p>
                            </div>
                        </article>
                    </div>
                </div>

                <div class="carousel-controls">
                    <button type="button" class="carousel-control prev" (click)="prevProduct(cat.key)"
                        aria-label="Prethodni proizvod">
                        <i class="fas fa-chevron-left" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="carousel-control next" (click)="nextProduct(cat.key)"
                        aria-label="Sljedeći proizvod">
                        <i class="fas fa-chevron-right" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="carousel-dots">
                    <button type="button" class="dot"
                        *ngFor="let product of carouselStates[cat.key].originalProducts; let i = index"
                        [class.active]="i === carouselStates[cat.key].realActiveIndex"
                        [attr.aria-current]="i === carouselStates[cat.key].realActiveIndex ? 'true' : null"
                        [attr.aria-label]="product.title"
                        (click)="goToProduct(cat.key, i)">
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
