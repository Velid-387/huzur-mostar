<section id="testimonials" class="animate-section">
    <div class="container">
        <h2 class="animate-item">Huzur ljudi o Huzuru</h2>
        <div class="testimonials-container">
            <div class="testimonial-card animate-item" *ngFor="let testimonial of testimonials" [class.card-flipped]="testimonial.flipped">
                <div class="testimonial-card-inner" role="button" tabindex="0" [attr.aria-pressed]="testimonial.flipped" aria-label="Okreni karticu i pogledaj originalnu poruku" [class.flipped]="testimonial.flipped" (click)="toggleCardFlip(testimonial)" (keydown)="onCardKey($event, testimonial)">
                    <div class="testimonial-card-front">
                        <p>"{{ testimonial.content }}"</p>
                        <p class="testimonial-name">{{ testimonial.name }}</p>
                    </div>
                    <div class="testimonial-card-back">
                        <img [src]="testimonial.imagePath" [alt]="'Snimak originalne poruke: ' + testimonial.content" loading="lazy">
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
